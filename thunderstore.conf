# Thunderstore package settings, read by package.sh and the Makefile.
# Plain KEY=value lines (sourced by bash), no spaces around '='.

NAMESPACE=ELEVATED
NAME=KarmaLocking
VERSION=1.0.0
DESCRIPTION="Click a selected Karma level again to lock it: Karma stays at that level for the whole run. Only the host needs the mod."
WEBSITE_URL="https://github.com/TheElevatedOne/KarmaLocking"

# Space-separated Thunderstore dependency strings (Namespace-Name-Version).
DEPENDENCIES="RiskofThunder-RoR2BepInExPack-1.46.0 RiskofThunder-HookGenPatcher-1.2.9"

# Where built zips are written.
OUTPUT_DIR=dist
